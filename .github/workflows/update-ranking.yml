
name: Update UEFA Club Ranking

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "update_ranking.py"
      - ".github/workflows/update-ranking.yml"

  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Read official UEFA ranking
        run: python update_ranking.py

      - name: Commit updated ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking.json
          if git diff --cached --quiet; then
            echo "Ranking has not changed."
          else
            git commit -m "Update official UEFA club ranking"
            git push
          fi
